version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takai_app
    restart: always
    ports:
      - "3000:3000"     # Maps port 3000 on your Debian host to port 3000 inside container
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
