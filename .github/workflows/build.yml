name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: 
      contents: write
      workflow: write

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
    - uses: pnpm/setup@v2
      with:
        version: 11
        runtime: node@24
        cache: true

    - run: pnpm format
    - name: Commit formatting changes
      run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Style: Apply oxfmt formatting"
            git push
          else
            echo "Already formatted, nothing to commit."
          fi
    - run: pnpm audit
    - run: pnpm lint

    - name: Build
      run: |
        pnpm build
